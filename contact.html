<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Contact Us - Travel Recommendation</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==================== NAVIGATION BAR ==================== -->

    <nav class="navbar">

        <!-- Website logo -->
        <div class="logo">
            Travel Recommendation
        </div>

        <!-- Navigation links -->
        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About Us</a>
            </li>

            <li>
                <a href="contact.html">Contact Us</a>
            </li>

        </ul>

    </nav>


    <!-- ==================== CONTACT US ==================== -->

    <main class="contact-container">

        <h1>Contact Us</h1>

        <p>
            Have a question or want to share a travel recommendation?
            Send us a message.
        </p>


        <!-- Email/contact form -->
        <form class="contact-form">

            <!-- Name -->
            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- Email -->
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- Message -->
            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Enter your message"
                required
            ></textarea>


            <!-- Submit button -->
            <button type="submit">
                Submit
            </button>

        </form>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <footer>

        <p>
            &copy; 2026 Travel Recommendation Web Application
        </p>

    </footer>

</body>

</html>
